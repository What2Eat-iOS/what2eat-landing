<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Download What2Eat - Smart Food Scanner App</title>
    <meta name="title" content="Download What2Eat - Smart Food Scanner App">
    <meta name="description" content="Download What2Eat app from the App Store. Free smart food scanner with nutrition analysis, health scoring, and allergen detection.">
    <meta name="robots" content="index, follow">
    
    <!-- Redirect Meta Tag -->
    <meta http-equiv="refresh" content="0; url=https://apps.apple.com/in/app/what2eat-know-your-food/id6743315237">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://what2eat.live/download.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/What2Eat_logo.PNG">
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/What2Eat_logo.PNG">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f56900 0%, #ff8533 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .download-container {
            max-width: 500px;
            padding: 40px 20px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .app-store-button {
            display: inline-block;
            margin-bottom: 20px;
            transition: transform 0.2s ease;
        }
        
        .app-store-button:hover {
            transform: translateY(-2px);
        }
        
        .app-store-button img {
            height: 60px;
            width: auto;
        }
        
        .fallback-link {
            display: block;
            color: white;
            text-decoration: underline;
            font-size: 16px;
            opacity: 0.8;
        }
        
        .fallback-link:hover {
            opacity: 1;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
            
            .download-container {
                padding: 20px;
            }
        }
    </style>
    
    <!-- Redirect Script -->
    <script>
        // Immediate redirect to App Store
        window.location.href = 'https://apps.apple.com/in/app/what2eat-know-your-food/id6743315237';
    </script>
</head>
<body>
    <div class="download-container">
        <div class="logo">
            <img src="Assets/What2Eat_logo.PNG" alt="What2Eat Logo">
        </div>
        
        <h1>Redirecting to App Store...</h1>
        <p>You're being redirected to download What2Eat from the App Store.</p>
        
        <div class="spinner"></div>
        
        <a href="https://apps.apple.com/in/app/what2eat-know-your-food/id6743315237" class="app-store-button">
            <img src="Assets/Download on appstore.svg" alt="Download on App Store">
        </a>
        
        <p>If you're not redirected automatically, 
            <a href="https://apps.apple.com/in/app/what2eat-know-your-food/id6743315237" class="fallback-link">click here to download</a>
        </p>
        
        <p style="font-size: 14px; margin-top: 20px;">
            <a href="/" class="fallback-link">← Back to What2Eat Home</a>
        </p>
    </div>
</body>
</html>
